services:
  neo4j:
    image: neo4j:5.26
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - ./dados/neo4j:/var/lib/neo4j/import
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 30
volumes:
  neo4j-data:
